# Z-Storm Configuration
# Advanced Network Attack Framework

interface: eth0

attack:
  mode: "intelligent"
  type: "dhcp_starvation"
  threads: 5
  max_macs: 10000
  delay_min: 0.001
  delay_max: 0.01
  auto_detect_dhcp: true
  timeout: 300

smart_scanner:
  enabled: true
  timeout: 5
  classify_devices: true

reporting:
  enabled: true
  formats: ["json", "html", "markdown"]
  include_network_info: true
  include_recommendations: true
  save_path: "reports/"

arp_spoofing:
  enabled: false
  target_ip: null
  gateway_ip: null
  interval: 2.0
  restore_on_exit: true

# NEW: DTP Spoofing Configuration
dtp_spoofing:
  enabled: false
  target_mac: null
  interval: 5.0
  domain: "z-storm-vlan"
  status: 3
  vtp: 1
  neighbor: 1
  randomize_delay: false
  negotiate_desirable: true
  vlan_range: "1-4094"

lab_automation:
  enabled: false
  lab_type: "eve-ng"
  auto_setup: true
  auto_cleanup: true

logging:
  level: "INFO"
  file: "zstorm.log"
  max_size_mb: 10
  backup_count: 3
  console_output: true

stealth:
  enabled: false
  randomize_delay: true
  spoof_mac: false
  randomize_mac_oui: true

performance:
  batch_size: 100
  queue_size: 1000
  optimize_buffer: true

security:
  ethical_use: true
  require_auth: false
  allowed_ips: []
  disable_dangerous: false
